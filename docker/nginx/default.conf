server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Use the container_name, not the bare compose service name "app" —
        # on the shared external network, a generic alias can collide with
        # another stack's same-named service (see DB_HOST in .env.example).
        fastcgi_pass resource-booking-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|ico)$ {
        # Livewire serves its core JS dynamically at a hashed, non-existent-
        # on-disk path (/livewire-{hash}/livewire.min.js) via a Laravel route,
        # not a real file — without try_files here, nginx 404s it directly
        # instead of falling through to PHP, silently breaking all Livewire
        # interactivity on the page (looks "kind of broken": static HTML with
        # no working clicks/selection/submission).
        try_files $uri $uri/ /index.php?$query_string;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
